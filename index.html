<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Batrisyia & Wazien</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="invitation">

        <div class="envelope-wrapper" id="envelope">

            <div class="envelope">

                <!-- The invitation card hidden inside -->
                <div class="letter">
                    <p class="letter-small">
                        An invitation to celebrate
                    </p>

                    <h1>
                        Batrisyia
                        <span>&</span>
                        Wazien
                    </h1>

                    <p class="letter-date">
                        14 · 11 · 2027
                    </p>
                </div>

                <!-- Envelope -->
                <div class="envelope-back"></div>
                <div class="envelope-left"></div>
                <div class="envelope-right"></div>
                <div class="envelope-bottom"></div>

                <!-- Top flap -->
                <div class="envelope-flap"></div>

                <!-- Wax seal -->
                <button
                    class="wax-seal"
                    id="waxSeal"
                    aria-label="Open invitation"
                >
                    B <span>&</span> W
                </button>

            </div>

        </div>

        <p class="open-text" id="openText">
            Tap the seal to open
        </p>

    </main>

<section class="garden-scene" id="gardenScene">

<div class="garden-landscape" aria-hidden="true">

    <div class="garden-sky"></div>

    <div class="distant-trees"></div>

    <div class="flower-bank flower-bank-left"></div>
    <div class="flower-bank flower-bank-right"></div>

    <div class="garden-pond">
        <div class="water-ripple ripple-one"></div>
        <div class="water-ripple ripple-two"></div>
        <div class="water-ripple ripple-three"></div>
    </div>

    <div class="foreground-flowers foreground-left"></div>
    <div class="foreground-flowers foreground-right"></div>

</div>
    
    <div class="garden-content">

        <p class="garden-intro">
            Dengan penuh kesyukuran
        </p>

        <h2>
            Majlis Persandingan
            <span>dan</span>
            Akad Nikah
        </h2>

        <div class="garden-divider">❦</div>

        <p class="garden-names">
            Mohammad Wazien Najmuddin bin Abdullah
            <span>dengan</span>
            Norbatrisyia binti Haji Hirman
        </p>

        <p class="garden-hashtag">
            #batwazmeanttobe
        </p>

    </div>

</section>
    
    <script src="script.js"></script>

</body>
</html>
