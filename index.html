<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Batrisyia & Wazien</title>

    <!-- Elegant wedding fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >

    <!-- Change this number whenever CSS is updated -->
    <link rel="stylesheet" href="style.css?v=10000">
</head>


<body>

    <!-- =========================================
         OPENING ENVELOPE
         ========================================= -->

    <section class="opening-screen" id="openingScreen">

        <p class="open-instruction" id="openInstruction">
            Tap the seal to open
        </p>


        <div class="envelope-wrapper" id="envelope">

            <div class="envelope">

                <!-- Back of envelope -->
                <div class="envelope-back"></div>


                <!-- Invitation card -->
                <div class="letter">

                    <div class="letter-inner">

                        <p class="letter-small">
                            An invitation to celebrate
                        </p>

                        <h1>
                            Batrisyia

                            <span>&</span>

                            Wazien
                        </h1>

                        <p class="letter-date">
                            14 · 11 · 2027
                        </p>

                    </div>

                </div>


                <!-- Front envelope folds -->
                <div class="envelope-left"></div>
                <div class="envelope-right"></div>
                <div class="envelope-bottom"></div>


                <!-- Closing flap -->
                <div class="envelope-flap"></div>


                <!-- Wax seal -->
                <button
                    class="wax-seal"
                    id="waxSeal"
                    aria-label="Open wedding invitation"
                >
                    <span class="seal-text">B & W</span>
                </button>

            </div>

        </div>

    </section>



    <!-- =========================================
         MONET GARDEN
         ========================================= -->

    <main class="garden-scene" id="gardenScene">

        <!-- Painted sky -->
        <div class="sky"></div>

        <!-- Distant foliage -->
        <div class="distant-garden"></div>

        <!-- Garden masses -->
        <div class="garden-bed garden-bed-left"></div>
        <div class="garden-bed garden-bed-right"></div>

        <!-- Pond -->
        <div class="pond">

            <div class="reflection reflection-one"></div>
            <div class="reflection reflection-two"></div>
            <div class="reflection reflection-three"></div>

            <div class="lily lily-one"></div>
            <div class="lily lily-two"></div>
            <div class="lily lily-three"></div>
            <div class="lily lily-four"></div>

        </div>


        <!-- Foreground foliage -->
        <div class="foreground foreground-left"></div>
        <div class="foreground foreground-right"></div>


        <!-- Wedding wording -->
        <div class="garden-content">

            <p class="garden-intro">
                Dengan penuh kesyukuran
            </p>

            <h2>
                Majlis Persandingan

                <span>dan</span>

                Akad Nikah
            </h2>


            <div class="garden-ornament">
                ❦
            </div>


            <div class="couple-names">

                <p>
                    Mohammad Wazien Najmuddin
                    <br>
                    bin Abdullah
                </p>

                <span>dengan</span>

                <p>
                    Norbatrisyia binti
                    <br>
                    Haji Hirman
                </p>

            </div>


            <p class="hashtag">
                #batwazmeanttobe
            </p>

        </div>

    </main>


    <script src="script.js?v=10000"></script>

</body>

</html>
